spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/smartfood}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history_user

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-service:8761/eureka}

app:
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:/app/keys/private-pkcs8.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:/app/keys/public.pem}
    expiration-ms: 86400000

logging:
  level:
    org.springframework.security: INFO