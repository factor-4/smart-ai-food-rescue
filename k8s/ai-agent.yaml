apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent
  namespace: smartfood
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-agent
  template:
    metadata:
      labels:
        app: ai-agent
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command: ['sh', '-c']
          args:
            - |
              until pg_isready -h postgres -p 5432 -U admin; do
                echo "waiting for postgres..."; sleep 2;
              done
              echo "postgres is ready"
        - name: init-schema
          image: postgres:16-alpine
          command: ['sh', '-c']
          args:
            - |
              PGPASSWORD=$DB_PASSWORD psql -h postgres -U admin -d smartfood -f /schema/init.sql
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartfood-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - name: schema
              mountPath: /schema
              readOnly: true
      containers:
        - name: ai-agent
          image: smartfood-ai:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: smartfood
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: smartfood-config
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartfood-secrets
                  key: DB_PASSWORD
            - name: OLLAMA_BASE_URL
              value: "http://host.docker.internal:11434"
            - name: LANGCHAIN_TRACING_V2
              value: "false"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
      volumes:
        - name: schema
          configMap:
            name: ai-agent-schema
---
apiVersion: v1
kind: Service
metadata:
  name: ai-agent
  namespace: smartfood
spec:
  selector:
    app: ai-agent
  ports:
    - port: 8000
      targetPort: 8000