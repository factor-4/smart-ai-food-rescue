apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: smartfood
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: smartfood-order:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: smartfood-config
                  key: DB_URL
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: smartfood-config
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartfood-secrets
                  key: DB_PASSWORD
            - name: EUREKA_URL
              valueFrom:
                configMapKeyRef:
                  name: smartfood-config
                  key: EUREKA_URL
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: smartfood-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: MCP_AI_AGENT_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: smartfood-config
                  key: MCP_AI_AGENT_BASE_URL
            - name: JWT_PUBLIC_KEY_PATH
              value: /app/keys/public.pem
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: smartfood-secrets
                  key: STRIPE_SECRET_KEY
          volumeMounts:
            - name: jwt-keys
              mountPath: /app/keys
              readOnly: true
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 40
            periodSeconds: 10
      volumes:
        - name: jwt-keys
          secret:
            secretName: smartfood-secrets
            items:
              - key: JWT_PUBLIC_KEY
                path: public.pem
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: smartfood
spec:
  selector:
    app: order-service
  ports:
    - port: 8083
      targetPort: 8083