apiVersion: v1
kind: ConfigMap
metadata:
  name: smartfood-config
  namespace: smartfood
data:
  DB_URL: jdbc:postgresql://postgres:5432/smartfood
  DB_USERNAME: admin
  EUREKA_URL: http://discovery-service:8761/eureka
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  AI_AGENT_URL: http://ai-agent:8000
  MCP_AI_AGENT_BASE_URL: http://ai-agent:8000
  JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
  JWT_PRIVATE_KEY_PATH: /app/keys/private-pkcs8.pem