apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-agent-schema
  namespace: smartfood
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS bag_embeddings (
        bag_id BIGINT PRIMARY KEY REFERENCES bags(id) ON DELETE CASCADE,
        embedding vector(384) NOT NULL
    );

    CREATE TABLE IF NOT EXISTS user_clicks (
        id BIGSERIAL PRIMARY KEY,
        user_id BIGINT NOT NULL,
        bag_id BIGINT NOT NULL,
        context VARCHAR(50) DEFAULT 'recommendation',
        clicked_at TIMESTAMP NOT NULL DEFAULT NOW()
    );

    CREATE TABLE IF NOT EXISTS user_purchases (
        id BIGSERIAL PRIMARY KEY,
        user_id BIGINT NOT NULL,
        bag_id BIGINT NOT NULL,
        order_id BIGINT,
        price_paid NUMERIC(10,2),
        purchased_at TIMESTAMP NOT NULL DEFAULT NOW()
    );

    CREATE TABLE IF NOT EXISTS recommendations_shown (
        id BIGSERIAL PRIMARY KEY,
        user_id BIGINT NOT NULL,
        session_id VARCHAR(100),
        bag_ids BIGINT[],
        shown_at TIMESTAMP NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_user_clicks_user ON user_clicks(user_id);
    CREATE INDEX IF NOT EXISTS idx_user_purchases_user ON user_purchases(user_id);
    CREATE INDEX IF NOT EXISTS idx_recommendations_shown_user ON recommendations_shown(user_id);