apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smartfood-ingress
  namespace: smartfood
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "api-gateway"
spec:
  ingressClassName: nginx
  rules:
    - host: smartfood.local
      http:
        paths:
          # Frontend (React app)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
          # API calls go through the Gateway
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          # WebSocket connections go through the Gateway
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          # MCP tool calls go through the Gateway
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080