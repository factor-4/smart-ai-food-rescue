apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-service
  namespace: smartfood
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pricing-service
  template:
    metadata:
      labels:
        app: pricing-service
    spec:
      containers:
        - name: pricing-service
          image: smartfood-pricing:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: smartfood-config
                  key: DB_URL
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: smartfood-config
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartfood-secrets
                  key: DB_PASSWORD
            - name: EUREKA_URL
              valueFrom:
                configMapKeyRef:
                  name: smartfood-config
                  key: EUREKA_URL
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: smartfood-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: MCP_AI_AGENT_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: smartfood-config
                  key: MCP_AI_AGENT_BASE_URL
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 40
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: pricing-service
  namespace: smartfood
spec:
  selector:
    app: pricing-service
  ports:
    - port: 8085
      targetPort: 8085